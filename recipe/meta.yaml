{% set name = "dynamicisttoolkit" %}
{% set version = "0.7.0" %}
{% set sha256 = "a832ce7a5928a014fcca1c2a3126128eaaafca696f8efd2b3fa1e2a2eef72941" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation"

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=68.1.2
  run:
    - matplotlib-base >=3.6.3
    - numpy >=1.26.4
    - python >={{ python_min }}
    - scipy >=1.11.4

test:
  requires:
    - python {{ python_min }}
  imports:
    - dtk
    - dtk.bicycle
    - dtk.inertia
    - dtk.process
    - dtk.test

about:
  home: http://github.com/moorepants/dynamicisttoolkit
  license: Unlicense
  license_file: UNLICENSE.txt
  summary: 'Various tools for theoretical and experimental dynamics.'
  doc_url: http://dynamicisttoolkit.readthedocs.io/
  dev_url: https://github.com/moorepants/dynamicisttoolkit

extra:
  recipe-maintainers:
    - moorepants
